
name: Build Rick Portal Gun Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project archive
        run: |
          unzip -o rick-portal-gun-mod-1.12.2-forge.zip -d extracted
          ROOT="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          cp -a "$ROOT"/. .

      - name: Install Gradle 4.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '4.9'

      - name: Build Minecraft mod
        run: gradle setupCiWorkspace build --no-daemon --stacktrace

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: rickportalgun-1.12.2-1.0.0
          path: build/libs/rickportalgun-1.12.2-1.0.0.jar
          if-no-files-found: error
